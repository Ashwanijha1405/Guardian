<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alexa+ Simulator · Guardian</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="stage">
      <div class="device" aria-label="Echo Show simulator">
        <div class="screen" id="screen" data-mode="idle">
          <section class="idle" aria-hidden="false">
            <p class="clock" id="clock"></p>
            <p class="date" id="date"></p>
            <p class="greeting">Namaste, Dadi</p>
          </section>

          <section class="convo">
            <div class="talk">
              <p class="heard" id="heard"></p>
              <p class="reply" id="reply" aria-live="polite"></p>
              <p class="waiting" id="waiting" hidden></p>
            </div>
            <div class="card-slot" id="card-slot" hidden></div>
          </section>

          <p class="quiet-badge" lang="hi">Silent · चुपचाप</p>
          <div class="lightbar" id="lightbar" aria-hidden="true"></div>
        </div>
      </div>

      <section class="controls">
        <button class="mic" id="mic" aria-label="Talk to Alexa">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
        </button>
        <button class="quiet-toggle" id="quiet" aria-pressed="false" title="The caller may be watching: Dadi asks by tapping, Alexa answers on screen only">
          Ask silently
        </button>
        <div class="presets" role="group" aria-label="Demo presets">
          <button data-preset="digital_arrest">Digital arrest</button>
          <button data-preset="grandson">Grandson</button>
          <button data-preset="benign">Benign</button>
        </div>
        <select id="mic-lang" aria-label="Speech recognition language">
          <option value="hi-IN">हिन्दी (hi-IN)</option>
          <option value="en-IN">English (en-IN)</option>
          <option value="en-US">English (en-US)</option>
        </select>
      </section>

      <details class="typed">
        <summary>Type instead</summary>
        <form id="type-form">
          <input id="type-input" autocomplete="off" placeholder="What did the caller say?" />
          <button>Send</button>
        </form>
      </details>

      <details class="dev" id="dev">
        <summary>Developer panel · MCP tool calls</summary>
        <p class="dev-meta" id="dev-meta">Connecting to Guardian…</p>
        <ol class="dev-log" id="dev-log"></ol>
      </details>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
