<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4efe8" />
    <title>Guardian · Family</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="phone">
      <header class="top">
        <span class="brand">Guardian</span>
        <div class="lang" role="group" aria-label="Language">
          <button data-lang="en">EN</button>
          <button data-lang="hi" lang="hi">हिं</button>
        </div>
      </header>

      <section id="status" aria-live="assertive"></section>

      <section class="last">
        <p id="last-alert"></p>
        <button class="link" id="history-toggle" aria-expanded="false" aria-controls="history"></button>
      </section>
      <ul class="history" id="history" hidden></ul>
    </main>

    <nav class="preview" aria-label="Preview state (mock data)" hidden>
      <span class="preview-label">Mock</span>
      <button data-scenario="safe">All clear</button>
      <button data-scenario="pending-da">Pending · arrest</button>
      <button data-scenario="pending-gp">Pending · grandson</button>
      <button data-scenario="confirmed">Confirmed</button>
      <button data-scenario="help">Needs help</button>
      <button data-scenario="noresponse">No response</button>
    </nav>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="mock.js"></script>
    <script src="app.js"></script>
  </body>
</html>
